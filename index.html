    <!--
      资源请求失败报告（整改方案 §4.3）：
      资源类 error 事件不冒泡，只能在捕获阶段拿到。这段脚本必须排在下面的
      preload 之前，才能保证 404 的预加载也被点名。
    -->
    <script>
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target
          if (!t || t === window) return
          var url = t.href || t.currentSrc || t.src
          if (!url) return
          if (t.tagName === 'LINK' && t.rel === 'preload') {
            console.error('[preload] 预加载失败，检查 assetManifest 与 index.html 是否漂移：', url)
          } else if (t.tagName === 'LINK' || t.tagName === 'IMG' || t.tagName === 'SCRIPT') {
            console.error('[asset] 资源请求失败：', url)
          }
        },
        true,
      )
    </script>

    <!--
      首屏关键预加载。**唯一事实来源是 src/experience/assetManifest.ts 里
      preload: true 的条目**，两边必须一一对应；开发模式下
      auditPreloadLinks() 会校验漂移，并确认 URL 真的返回 image/*
      而不是被 SPA fallback 用 HTML 冒充 200。
    -->
    <link rel="preload" as="image" type="image/webp" href="/assets/obj/posterwall.webp" />
    <link rel="preload" as="image" type="image/webp" href="/assets/obj/findaword2.webp" />
    <link rel="preload" as="image" type="image/webp" href="/assets/obj2/polaroids.webp" />
    <link rel="preload" as="image" type="image/webp" href="/assets/obj2/doorDecals.webp" />
